# ------------------------------------------------
# Elastic APM Configuration
# ------------------------------------------------
#
# Service name appears in APM UI
elastic.apm.service_name=ce-mule-base

# APM Server URL - Uses APISIX routing for CloudHub compatibility
# Format: http://<apisix-host>:9080/apm-server
# - Docker local: http://apisix:9080/apm-server (internal APISIX)
# - CloudHub: http://<external-ip-or-domain>:9080/apm-server (external APISIX)
# Override this property per environment (local-docker.properties, cloudhub.properties, etc.)
elastic.apm.server_url=http://apisix:9080/apm-server

# Environment name (dev, qa, prod)
elastic.apm.environment=docker-local

# Application version (will be updated by build script)
elastic.apm.service_version=${ce.version}

# Log level for APM agent (ERROR, WARN, INFO, DEBUG, TRACE)
elastic.apm.log_level=INFO

# Enable/disable the agent
elastic.apm.enabled=true

# Transaction sampling rate (1.0 = 100%, 0.5 = 50%)
elastic.apm.transaction_sample_rate=1.0

# Capture request/response bodies
elastic.apm.capture_body=all

# Stack trace limit
elastic.apm.stack_trace_limit=50

# Application packages for APM to monitor
elastic.apm.application_packages=com.acqua

# Span frame threshold (milliseconds)
elastic.apm.span_frames_min_duration=5ms

# Enable distributed tracing
elastic.apm.enable_distributed_tracing=true
