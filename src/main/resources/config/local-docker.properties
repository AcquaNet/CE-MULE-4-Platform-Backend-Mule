# DETALLE
# ------------------------------------
#
#  Esta configuracion es para cuando todo corre en Dockers localmente
#  Para ejecutar esto en modo local fuera de docker usar local.properties
#
# ------------------------------------------------
# HTTPS
# ------------------------------------------------
http.port=8081
https.port=8082

# ------------------------------------------------
# Elastic APM Configuration
# ------------------------------------------------
# APM Server URL via APISIX (CloudHub compatible)
# Uses internal APISIX hostname for Docker network access
elastic.apm.server_url=http://apisix:9080/apm-server
elastic.apm.environment=docker-local
